[package]
name = "kairo-hub"
version = "0.1.0"
description = "Project launcher and reliability surface for Kairo Game Engine"
authors = ["Kairo Contributors"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "kairo_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = [] }

[dev-dependencies]
tempfile = "3.25.0"
