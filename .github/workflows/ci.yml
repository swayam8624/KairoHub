name: KairoHub CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript and Vite build
        run: npm run build

      - name: Frontend security audit
        run: npm audit --audit-level=high

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust tests with warnings as errors
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Inspect an actual open-source Godot game (fixed upstream revision)
        shell: bash
        run: |
          # Source: godotengine/godot-demo-projects, 2d/dodge_the_creeps (MIT).
          # Fetch the real game with its scenes/scripts/assets but no whole-repo
          # checkout. Test the intake contract, NOT a native Kairo gameplay port.
          git clone --filter=blob:none --sparse --no-checkout \
            https://github.com/godotengine/godot-demo-projects.git "$RUNNER_TEMP/kairo-godot-demo"
          git -C "$RUNNER_TEMP/kairo-godot-demo" sparse-checkout set 2d/dodge_the_creeps
          git -C "$RUNNER_TEMP/kairo-godot-demo" fetch --no-tags origin \
            b761b4cd5718a7118f2c95eb55f181d0a5f004f1
          git -C "$RUNNER_TEMP/kairo-godot-demo" checkout --detach \
            b761b4cd5718a7118f2c95eb55f181d0a5f004f1
          cargo run --quiet --locked --manifest-path src-tauri/Cargo.toml \
            --bin kairo-hub-inspect-game -- \
            "$RUNNER_TEMP/kairo-godot-demo/2d/dodge_the_creeps" > "$RUNNER_TEMP/game-report.json"
          python3 - "$RUNNER_TEMP/game-report.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as file:
              report = json.load(file)
          assert report["engine"] == "Godot", report
          assert report["displayName"] == "Dodge the Creeps", report
          assert report["mainScene"] == "res://main.tscn", report
          assert report["sceneFiles"] >= 4, report
          assert report["scriptFiles"] >= 4, report
          assert report["nativeSceneCandidate"] is None, report
          print("REAL GAME INTAKE PASSED: Godot source inspected; native GDScript migration is not claimed")
          PY
          cargo run --quiet --locked --manifest-path src-tauri/Cargo.toml \
            --bin kairo-hub-inspect-game -- \
            "$RUNNER_TEMP/kairo-godot-demo/2d/dodge_the_creeps" --graph > "$RUNNER_TEMP/game-graph.json"
          python3 - "$RUNNER_TEMP/game-graph.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as file:
              graph = json.load(file)
          assert graph["sourceScene"] == "res://main.tscn", graph
          assert len(graph["nodes"]) >= 10, graph
          assert len(graph["signals"]) >= 5, graph
          assert len(graph["resources"]) >= 6, graph
          assert any("GDScript" in issue for issue in graph["unsupportedBehaviors"]), graph
          print("REAL SCENE GRAPH PASSED: nodes/resources/signals preserved; unsupported gameplay explicitly flagged")
          PY
          cargo run --quiet --locked --manifest-path src-tauri/Cargo.toml \
            --bin kairo-hub-inspect-game -- \
            "$RUNNER_TEMP/kairo-godot-demo/2d/dodge_the_creeps" --migration-plan > "$RUNNER_TEMP/migration-plan.json"
          python3 - "$RUNNER_TEMP/migration-plan.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as file:
              plan = json.load(file)
          assert plan["schema"] == "kairo-migration-plan 1", plan
          assert plan["engine"] == "Godot", plan
          assert plan["nativeGameplayReady"] is False, plan
          assert len(plan["sourceObjects"]) >= 10, plan
          assert len(plan["sourceAssets"]) >= 6, plan
          assert plan["signalCount"] >= 5, plan
          codes = {issue["code"] for issue in plan["issues"]}
          assert {"GDSCRIPT_RUNTIME", "CANVAS_2D_RUNTIME", "SIGNAL_BINDING"} <= codes, codes
          print("REAL GAME MIGRATION PLAN PASSED: authored objects and typed unresolved semantics recorded")
          PY

  original-game-baseline:
    name: Run real Godot game on original engine (not Kairo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch legally redistributable official 2D game source
        shell: bash
        run: |
          git clone --filter=blob:none --sparse --no-checkout \
            https://github.com/godotengine/godot-demo-projects.git "$RUNNER_TEMP/godot-demo"
          git -C "$RUNNER_TEMP/godot-demo" sparse-checkout set 2d/dodge_the_creeps
          git -C "$RUNNER_TEMP/godot-demo" fetch --no-tags origin \
            b761b4cd5718a7118f2c95eb55f181d0a5f004f1
          git -C "$RUNNER_TEMP/godot-demo" checkout --detach \
            b761b4cd5718a7118f2c95eb55f181d0a5f004f1

      - name: Install pinned and checksum-verified Godot 4.7.2
        shell: bash
        run: |
          curl -fsSL --retry 3 --max-time 240 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --version

      - name: Import real game and run 120 simulation frames headlessly
        shell: bash
        run: |
          GAME="$RUNNER_TEMP/godot-demo/2d/dodge_the_creeps"
          GODOT="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
          timeout 120 "$GODOT" --headless --path "$GAME" --import --quit
          timeout 40 "$GODOT" --headless --path "$GAME" --quit-after 120
          echo "REAL ORIGINAL GAME EXECUTION: PASS (Godot runtime, not KairoPlayer)"
